# GitLab CI/CD configuration file for ngen-cal repository

stages:
  - build
  - unit_test
  - sonarqube
  - deploy_test
  - ver_test
  - deploy_oe

build-job:
  stage: build
  script:
    - echo "Building NGEN-cal..."
    - sudo chmod 666 /var/run/docker.sock
    - docker rm -f ngen-cal-build-container || true
    - docker run --name ngen-cal-build-container -v .:/ngen-app/ngen-cal -e GITLAB_TOKEN=$GITLAB_TOKEN rockylinux:8 bash -c "cd /ngen-app/ngen-cal &&
        ./scripts/build.sh"
    - sudo chown -R `whoami` .
    - tar -czf ../ngen-cal.tar.gz .
    - docker cp ngen-cal-build-container:/ngen-app/ngen-cal-python ..
    - cd ../ngen-cal-python
    - tar -czf ../ngen-cal-python.tar.gz .
    - echo "Build complete."

unit-test-job:
  stage: unit_test
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Running unit tests..."
    - docker start ngen-cal-build-container
    - docker exec ngen-cal-build-container bash -c "
        export LD_LIBRARY_PATH=/ngen-app/opt/lib:$LD_LIBRARY_PATH &&
        source /ngen-app/ngen-cal-python/bin/activate &&
        cd /ngen-app/ngen-cal &&
        pytest --log-cli-level 0 ./python/ngen_cal/tests/ &&
        pytest --log-cli-level 0 ./python/ngen_conf/tests/ &&
        pytest --log-cli-level 0 ./python/ngen_init_config/test/" || true
    - echo "Unit tests complete"
  after_script:
    - sudo chown -R `whoami` .

sonarqube-job:
  stage: sonarqube
  variables:
    GIT_STRATEGY: none
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - echo "Running Sonarqube scan..."
    - |
      if [[ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]]; then
        ~/sonar-scanner-4.8.0.2856-linux/bin/sonar-scanner -Dsonar.projectKey=ngen-cal-$CI_COMMIT_BRANCH
      else
        ~/sonar-scanner-4.8.0.2856-linux/bin/sonar-scanner
      fi

