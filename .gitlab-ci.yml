# GitLab CI/CD configuration file for ngen-cal repository

# Include GitLab's official Container Scanning template
include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# Define CI pipeline stages
stages:
  - build
  - unit_test
  - sonarqube
  - test
  - deploy
  - release

# Base image for all jobs (can be overridden per job)
image: registry.sh.nextgenwaterprediction.com/infrastructure/docker/docker:latest

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_IMAGE_TAG: $CI_COMMIT_REF_NAME

# ------------------------------------------------------------------------------
# Pipeline trigger rules
# ------------------------------------------------------------------------------

# This controls whether a pipeline runs at all.
# Only run pipelines for:
# - Merge requests targeting protected branches
# - Tags (for release)
# - Manual trigger events
workflow:
  rules:
    # Manual trigger (Run pipeline button)
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: always

    # Any pipeline running on a protected branch (includes pushes & merge requests)
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: always

    # Tags (for release)
    - if: '$CI_COMMIT_TAG'
      when: always

    # All other cases: skip pipeline
    - when: never


# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------

build:
  stage: build
  variables:
    GIT_DEPTH: 100  # ensure we can detect ancestry properly with enough history
  script:
    - echo "Logging in to GitLab Container Registry to push this project image..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

    - echo "Logging in to GitLab Container Registry to pull ngen base image..."
    - echo "$DOCKER_AUTH_PASS" | docker login -u "$DOCKER_AUTH_USER" --password-stdin registry.sh.nextgenwaterprediction.com

    - echo "Detecting base protected branch for ngen image..."
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin development release-candidate master
    - |
      BASE_NGEN_IMAGE=""
      for BRANCH in development release-candidate master; do
        if git merge-base --is-ancestor origin/$BRANCH HEAD; then
          echo "This branch is based on $BRANCH"
          BASE_NGEN_IMAGE="$BRANCH"
          break
        fi
      done
      if [[ -z "$BASE_NGEN_IMAGE" ]]; then
        echo "WARNING: Could not determine base protected branch — defaulting to 'development'"
        BASE_NGEN_IMAGE="development"
      fi
      echo "=== Diagnostics ==="
      echo "CI_PROJECT_NAME: $CI_PROJECT_NAME"
      echo "CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME"
      echo "BASE_NGEN_IMAGE: $BASE_NGEN_IMAGE"
      echo "==================="
      docker pull registry.sh.nextgenwaterprediction.com/ngwpc/nwm-ngen/ngen:$BASE_NGEN_IMAGE
      echo "Building ${CI_PROJECT_NAME} Docker image..."
      docker build --no-cache \
        --build-arg CI_COMMIT_REF_NAME=${CI_COMMIT_REF_NAME} \
        --build-arg IMAGE_TAG=${BASE_NGEN_IMAGE} \
        --secret id=GITLAB_TOKEN,env=GITLAB_TOKEN \
        --tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .

      docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
      echo "Docker push complete: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
      docker logout

# ------------------------------------------------------------------------------
# Unit Test Stage
# ------------------------------------------------------------------------------

unit-test:
  stage: unit_test
  image: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
  needs: [build]
  script:
    - echo "Running Unit Tests..."
    - cd /ngen-app/ngen-cal
    - echo "Current Git commit hash:" && git rev-parse HEAD
    - echo "Last commit log:" && git log -1 --oneline
    - pytest --log-cli-level 0 ./python/runCalibValid/ngen_conf/tests/
    - pytest --log-cli-level 0 ./python/runCalibValid/ngen_cal/tests/

# ------------------------------------------------------------------------------
# SonarQube Stage (static code analysis)
# ------------------------------------------------------------------------------

sonarqube:
  stage: sonarqube
  image:
    name: registry.sh.nextgenwaterprediction.com/infrastructure/sonar-scanner-cli/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  variables:
    # Defines the location of the analysis task cache
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    # Shallow cloning needs to be disabled.
    # See https://docs.sonarqube.org/latest/analysis/gitlab-cicd/.
    GIT_DEPTH: 0
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  needs: [build]
  script:
    - sonar-scanner -X -Dsonar.verbose=true
  allow_failure: true

# ------------------------------------------------------------------------------
# Container Security Scanning
# ------------------------------------------------------------------------------

container_scanning:
  stage: test
  needs: [build]
  variables:
    SECURE_LOG_LEVEL: info
    CS_SEVERITY_THRESHOLD: UNKNOWN
    CS_IMAGE: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG

# ------------------------------------------------------------------------------
# Deploy to `latest` (only for pipelines on protected branches)
# ------------------------------------------------------------------------------

deploy:
  stage: deploy
  needs: [build]
  script:
    - echo "Logging in to GitLab Container Registry to push the image..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Pushing latest tag to registry..."
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:latest
    - docker push $DOCKER_IMAGE_NAME:latest
    - docker logout

# ------------------------------------------------------------------------------
# Release Stage (only runs for tag pushes)
# ------------------------------------------------------------------------------

release:
  stage: release
  needs: [build]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
  script:
    - echo "Logging in to GitLab Container Registry to push the image..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Pushing tagged release to registry..."
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
    - docker logout
