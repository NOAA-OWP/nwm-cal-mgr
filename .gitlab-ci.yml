        sudo rm -rf /ngen-app/archive/ngen-cal || true &&
        sudo mv /ngen-app/ngen-cal /ngen-app/archive || true &&
        sudo mkdir -p /ngen-app/ngen-cal &&
        sudo chown -R `whoami` /ngen-app/ngen-cal"
    - scp ../ngen-cal.tar.gz christina.osumi@10.105.140.252:/ngen-app/ngen-cal
    - scp ../ngen-cal-python.tar.gz christina.osumi@10.105.140.252:/ngen-app/ngen-cal-python
