# GitLab CI/CD configuration file for ngen-cal repository

# Include GitLab's official Container Scanning template
include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# Define CI pipeline stages
stages:
  - build
  - unit_test
  - sonarqube
  - test
  - deploy
  - release

# Base image for all jobs (can be overridden per job)
image: registry.sh.nextgenwaterprediction.com/infrastructure/docker/docker:latest

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_IMAGE_TAG: $CI_COMMIT_REF_NAME-test

build:
  stage: build
  variables:
    GIT_DEPTH: 100  # ensure we can detect ancestry properly with enough history
  rules:
    # Run for protected branches, MR pipelines targeting protected branches, and tag pipelines
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(development|release-candidate|master)$/'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    # Also run for direct feature branch pushes (but skip deploy/release)
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  script:
    - echo "Logging in to Gitlab Container Registry..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

    - echo "Detecting base protected branch for ngen image..."

    # Mark this directory as safe for Git (required in Git 2.35+ in container environments)
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Fetch the latest state of the known protected branches
    - git fetch origin development release-candidate master
    - |
      # Initialize to empty to detect fallback case later
      BASE_NGEN_IMAGE=""

      # Check if the current branch is descended from one of the protected branches
      for BRANCH in development release-candidate master; do
        if git merge-base --is-ancestor origin/$BRANCH HEAD; then
          echo "This branch is based on $BRANCH"
          BASE_NGEN_IMAGE="$BRANCH"
          break
        fi
      done

      # Fallback to development with a warning if no base branch was detected
      if [[ -z "$BASE_NGEN_IMAGE" ]]; then
        echo "WARNING: Could not determine base protected branch — defaulting to 'development'"
        BASE_NGEN_IMAGE="development"
      fi

      echo "Using ngen image tag: $BASE_NGEN_IMAGE"
    
      # Explicitly try pulling the ngen base image to detect errors early
      echo "Checking if ngen base image exists and is accessible..."
      if ! docker pull registry.sh.nextgenwaterprediction.com/ngwpc/nwm-ngen/ngen:$BASE_NGEN_IMAGE; then
        echo "ERROR: Failed to pull base ngen image: registry.sh.nextgenwaterprediction.com/ngwpc/nwm-ngen/ngen:$BASE_NGEN_IMAGE"
        echo "Make sure the image exists and you have permission to access it."
        exit 1
      fi

      # Use the actual branch name for tagging the built image
    - echo "Building ${CI_PROJECT_NAME} docker image..."

      # Display full docker build command with arguments
    - echo "Running [ docker build --no-cache --build-arg CI_COMMIT_REF_NAME=${CI_COMMIT_REF_NAME} --build-arg IMAGE_TAG=${BASE_NGEN_IMAGE} --secret id=GITLAB_TOKEN,env=GITLAB_TOKEN --tag ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG} . ]"

      # Build the docker image using the selected base image and tag
    - |
      docker build --no-cache \
        --build-arg CI_COMMIT_REF_NAME=${CI_COMMIT_REF_NAME} \
        --build-arg IMAGE_TAG=${BASE_NGEN_IMAGE} \
        --secret id=GITLAB_TOKEN,env=GITLAB_TOKEN \
        --tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" .

    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker logout

unit-test:
  stage: unit_test
  image: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
  needs: [build]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(development|release-candidate|master)$/'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: on_success

  script:
    - echo "Running Unit Tests..."
    - cd /ngen-app/ngen-cal
    # Debugging commands to check the current commit
    - echo "Current Git commit hash:"
    - git rev-parse HEAD  # Shows the current commit hash being used
    - echo "Last commit log:"
    - git log -1 --oneline  # Shows the last commit log to verify the latest commit
    - pytest --log-cli-level 0 ./python/runCalibValid/ngen_conf/tests/
    - pytest --log-cli-level 0 ./python/runCalibValid/ngen_cal/tests/

sonarqube:
  stage: sonarqube
  image:
    name: registry.sh.nextgenwaterprediction.com/infrastructure/sonar-scanner-cli/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  variables:
    # Defines the location of the analysis task cache
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    # Shallow cloning needs to be disabled.
    # See https://docs.sonarqube.org/latest/analysis/gitlab-cicd/.
    GIT_DEPTH: 0
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  needs: [build]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(development|release-candidate|master)$/'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
  script:
    - sonar-scanner -X -Dsonar.verbose=true
  allow_failure: true

container_scanning:
  stage: test
  needs: [build]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(development|release-candidate|master)$/'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
  variables:
    SECURE_LOG_LEVEL: info
    CS_SEVERITY_THRESHOLD: UNKNOWN
    CS_IMAGE: $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG

deploy:
  stage: deploy
  needs: [build]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
  script:
    - echo "Logging in to Gitlab Container Registry to push the image..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Pushing to the docker registry"
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:latest
    - docker push $DOCKER_IMAGE_NAME:latest
    - docker logout

release:
  stage: release
  needs: [build]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
  script:
    - echo "Logging in to Gitlab Container Registry to push the image..."
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Pushing to the docker registry"
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
    - docker logout

