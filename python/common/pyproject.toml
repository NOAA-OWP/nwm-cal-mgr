[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Shared utilities for nwm-cal-mgr Python components"
readme = "README.md"
requires-python = ">=3.10"

# Only include real runtime dependencies
dependencies = [
    "pydantic~=2.12.0",
    "typing_extensions",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
